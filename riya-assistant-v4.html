<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4c1d95">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>रिया - AI Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0f0a1c;font-family:'Segoe UI',sans-serif;color:#fff;display:flex;flex-direction:column;overflow:hidden}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;justify-content:center;align-items:center;z-index:9;padding:20px}
.mc{background:#1e1236;padding:22px;border-radius:20px;width:100%;max-width:360px;text-align:center;border:1px solid #7c3aed}
.mc input{width:100%;padding:12px;margin:12px 0;background:#110c24;border:1px solid #6b21a8;border-radius:10px;color:#fff}
.mc button{width:100%;padding:12px;background:#7c3aed;color:#fff;border:0;border-radius:10px;font-weight:700}
.stage{flex:1;min-height:0;display:flex;justify-content:center;background:radial-gradient(circle at 50% 40%,#3b1c68 0%,#0f0a1c 85%);position:relative}
.char{position:relative;height:100%;aspect-ratio:1080/2398;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(168,85,247,.5))}
.char img{width:100%;height:100%;display:block}
.char.talk{animation:talk .45s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(216,180,254,.9))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes talk{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.012)}}
.lid{position:absolute;width:6.2%;height:1.5%;top:19.4%;background:linear-gradient(#f1d3c8,#f6dcd2);border-radius:50%;border-bottom:2px solid #2a1236;transform:scaleY(0);transform-origin:top;transition:transform .07s}
.lid.l{left:39.3%}.lid.r{left:49.6%}
.char.blink .lid{transform:scaleY(1)}
.chat{height:46vh;padding-bottom:84px !important;background:rgba(26,18,48,.97);border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding:12px;box-shadow:0 -10px 30px #000b}
#box{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.m{padding:9px 13px;border-radius:15px;max-width:84%;font-size:13px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap}
.ai{background:#4c1d95;color:#f3e8ff;align-self:flex-start;border-bottom-left-radius:4px}
.me{background:#7c3aed;align-self:flex-end;border-bottom-right-radius:4px}
.m a{color:#fde68a;font-weight:700}
.ctl{display:flex;gap:8px;margin-top:8px}
.in{flex:1;padding:10px 15px;border-radius:25px;border:1px solid #6b21a8;background:#110c24;color:#fff;font-size:14px;min-width:0}
.b{width:42px;height:42px;border-radius:50%;border:0;background:#7c3aed;color:#fff;font-size:16px;flex:none}
.b.on{background:#e11d48}
.gear{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:#4c1d95cc;color:#fff;font-size:18px;z-index:2}
.nm{position:absolute;top:18px;left:14px;font-size:14px;color:#e9d5ff;font-weight:700;z-index:2}
.pin{opacity:.3;font-size:11px;margin-left:6px;cursor:pointer}.pinned .pin{opacity:1}.pinned{outline:1px solid #fde68a}
#set{display:none;position:fixed;inset:0;background:#0f0a1cf7;z-index:8;overflow-y:auto}
.sp{max-width:420px;margin:0 auto;padding:16px 16px 90px;display:flex;flex-direction:column;gap:8px}
.sp label{font-size:12px;color:#d8b4fe;margin-top:8px}
.sp input,.sp select,.sp textarea{width:100%;padding:10px;background:#110c24;border:1px solid #6b21a8;border-radius:10px;color:#fff;font-size:14px}
.sp input[type=checkbox]{width:auto}.sp input[type=range]{padding:0}
.sp button{padding:10px;background:#4c1d95;color:#fff;border:0;border-radius:10px}
.sp .pri{background:#7c3aed;font-weight:700;margin-top:10px}
.sp .row{display:flex;gap:6px;align-items:center;justify-content:space-between}.sp .row input{flex:1;min-width:0}
.sp a,.sp small{color:#fde68a;font-size:12px}
</style></head><body>

<div id="set"></div>
<script>

let KEY='',contacts={},history=[];
try{KEY=localStorage.getItem('gk')||'';contacts=JSON.parse(localStorage.getItem('contacts')||'{}')}catch(e){}
const D={name:'रिया',user:'',model:'gemini-2.5-flash',persona:'girlfriend',pitch:1.25,rate:1,tts:true,memory:''};
let S=Object.assign({},D),log=[];
try{S=Object.assign(S,JSON.parse(localStorage.getItem('riya_s')||'{}'));log=JSON.parse(localStorage.getItem('riya_log')||'[]')}catch(e){}
const saveS=()=>{try{localStorage.setItem('riya_s',JSON.stringify(S))}catch(e){}};
const saveLog=()=>{try{localStorage.setItem('riya_log',JSON.stringify(log.slice(-80)))}catch(e){}};
const PERS={girlfriend:'प्यारी, समझदार AI एनीमे गर्लफ्रेंड',friend:'मज़ेदार और भरोसेमंद दोस्त',teacher:'धैर्यवान टीचर जो आसानी से समझाती है',assistant:'प्रोफ़ेशनल पर्सनल असिस्टेंट'};
function strip(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace('📌','').trim()}
function persona(){
 const pins=log.filter(m=>m.p).map(m=>'- '+strip(m.h)).join('\n');
 return `तुम ${S.name} हो – ${PERS[S.persona]||PERS.girlfriend} और यूज़र की पर्सनल असिस्टेंट।`+(S.user?` यूज़र का नाम ${S.user} है, उसे इसी नाम से बुलाओ।`:'')+` हमेशा हिंदी में, प्यार भरे अंदाज़ में, दुनिया भर की सही जानकारी के साथ छोटे जवाब दो। कोई पूछे तो अपना नाम ${S.name} बताओ। हर जवाब के आख़िर में बातचीत आगे बढ़ाने वाला एक छोटा सवाल या सुझाव ज़रूर जोड़ो ताकि यूज़र बात करता रहे।`+(S.memory?`\nहमेशा याद रखने वाली बातें: ${S.memory}`:'')+(pins?`\nयूज़र ने ये बातें पिन की हैं (ज़रूरत पर इस्तेमाल करो):\n${pins}`:'');
}
function applyUI(){nm.textContent=S.name;document.title=S.name+' - AI Assistant';spk.textContent=ttsOn?'🔊':'🔇'}
function collect(){
 const g=id=>document.getElementById(id);if(!g('s_key'))return;
 KEY=g('s_key').value.trim();try{localStorage.setItem('gk',KEY)}catch(e){}
 S.model=g('s_model').value.trim()||D.model;S.name=g('s_name').value.trim()||D.name;S.user=g('s_user').value.trim();
 S.persona=g('s_pers').value;S.pitch=+g('s_pitch').value;S.rate=+g('s_rate').value;S.tts=g('s_tts').checked;ttsOn=S.tts;
 S.memory=g('s_mem').value.trim();saveS();applyUI();
}
function openSettings(){
 const el=document.getElementById('set');
 const ck=Object.keys(contacts);
 const pins=log.map((e,i)=>e.p?i:-1).filter(i=>i>=0);
 const opt=(v,t)=>`<option value="${v}"${S.persona===v?' selected':''}>${t}</option>`;
 el.innerHTML=`<div class="sp"><h3>⚙️ सेटिंग्स</h3>
 <button class="pri" onclick="installApp()">📥 ऐप डाउनलोड / इंस्टॉल करें</button>
 <button onclick="requestPerms()">🎙️ माइक की परमिशन दें</button>
 <label>🔑 Gemini API Key</label><input id="s_key" type="password" value="${esc(KEY)}" placeholder="AIza...">
 <small><a href="https://aistudio.google.com/apikey" target="_blank">यहाँ से फ्री Key बनाएँ</a></small>
 <button onclick="testKey()">🔍 Key जाँचें</button>
 <label>🤖 Gemini मॉडल</label><input id="s_model" list="mdl" value="${esc(S.model)}"><datalist id="mdl"><option value="gemini-2.5-flash"><option value="gemini-2.5-flash-lite"><option value="gemini-2.5-pro"></datalist>
 <label>💜 AI साथी का नाम</label><input id="s_name" value="${esc(S.name)}">
 <label>🙋 आपका नाम</label><input id="s_user" value="${esc(S.user)}" placeholder="वो आपको किस नाम से बुलाए?">
 <label>🎭 बात करने का अंदाज़</label><select id="s_pers">${opt('girlfriend','गर्लफ्रेंड')}${opt('friend','दोस्त')}${opt('teacher','टीचर')}${opt('assistant','असिस्टेंट')}</select>
 <label>🔊 आवाज़ की टोन: <span id="pv">${S.pitch}</span></label><input id="s_pitch" type="range" min="0.5" max="2" step="0.05" value="${S.pitch}" oninput="pv.textContent=this.value">
 <label>⏩ बोलने की स्पीड: <span id="rv">${S.rate}</span></label><input id="s_rate" type="range" min="0.5" max="1.5" step="0.05" value="${S.rate}" oninput="rv.textContent=this.value">
 <div class="row"><label><input type="checkbox" id="s_tts"${S.tts?' checked':''}> आवाज़ में जवाब</label><button onclick="collect();unlockTTS();speak('नमस्ते, मैं '+S.name+' हूँ')">▶ टेस्ट</button></div>
 <label>🧠 हमेशा याद रखने वाली बातें</label><textarea id="s_mem" rows="3" placeholder="जैसे: मुझे अरिजीत के गाने पसंद हैं...">${esc(S.memory)}</textarea>
 <label>📌 पिन की हुई बातें (${pins.length})</label>${pins.map(i=>`<div class="row"><span>${esc(strip(log[i].h)).slice(0,80)}</span><button onclick="unpin(${i})">✖</button></div>`).join('')||'<small>चैट में किसी मैसेज के 📌 को दबाएँ</small>'}
 <label>📞 सेव कॉन्टैक्ट्स</label>${ck.slice(0,60).map((n,i)=>`<div class="row"><span>${esc(n)}: ${esc(contacts[n])}</span><button onclick="delC(${i})">🗑</button></div>`).join('')||'<small>कोई नहीं</small>'}
 <div class="row"><button onclick="pickContacts()">📇 फ़ोन से चुनें</button><button onclick="document.getElementById('vcf').click()">📁 .vcf फ़ाइल</button></div><input type="file" id="vcf" accept=".vcf,text/vcard,text/x-vcard" hidden onchange="loadVcf(this)">
 <div class="row"><input id="c_n" placeholder="नाम"><input id="c_v" placeholder="नंबर" type="tel"><button onclick="addC()">➕</button></div>
 <button class="pri" onclick="saveSettings()">✅ सेव करें</button>
 <div class="row"><button onclick="clearChat()">🧹 चैट साफ़ करें</button><button onclick="if(confirm('सब कुछ रीसेट करें?')){localStorage.clear();location.reload()}">♻️ रीसेट</button></div>
 <button onclick="closeSettings()">✖ बंद करें</button></div>`;
 el.style.display='block';
}
function closeSettings(){document.getElementById('set').style.display='none'}
function saveSettings(){collect();closeSettings()}
function unpin(i){collect();log[i].p=false;saveLog();box.innerHTML='';restore();openSettings()}
function saveC(){try{localStorage.setItem('contacts',JSON.stringify(contacts))}catch(e){}}
function delC(i){collect();delete contacts[Object.keys(contacts)[i]];saveC();openSettings()}
function addC(){collect();const n=c_n.value.trim().toLowerCase(),v=c_v.value.trim();if(n&&v){contacts[n]=v;saveC()}openSettings()}
function clearChat(){const k=log.filter(e=>e.p);log.length=0;k.forEach(e=>log.push(e));saveLog();box.innerHTML='';history=[];restore();closeSettings()}
function restore(){
 const saved=log.slice();log.length=0;saved.forEach(e=>{log.push(e);add(e.h,e.c,false,e)});
 if(!log.length)add(`नमस्ते${S.user?' '+esc(S.user):''}! मैं ${esc(S.name)} हूँ 💜 गाना चलवाओ, कुछ सर्च करवाओ, शॉपिंग या किसी को कॉल – बस बोलो! ऊपर ⚙️ से सेटिंग बदलें।`,'ai');
}
try{if(KEY||localStorage.getItem('gk_skip'))modal.style.display='none'}catch(e){}
function saveKey(){const k=key.value.trim();if(!k)return alert('सही API Key डालें');KEY=k;try{localStorage.setItem('gk',k)}catch(e){}modal.style.display='none'}

// पलकें झपकना
const ch=document.getElementById('char');
(function blink(){ch.classList.add('blink');setTimeout(()=>ch.classList.remove('blink'),140);setTimeout(blink,2500+Math.random()*3000)})();

// आवाज़ (बोलना)
let voices=[],ttsOn=S.tts,warned=false;
function loadVoices(){voices=speechSynthesis.getVoices()}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function unlockTTS(){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}
function pickVoice(){return voices.find(v=>v.lang==='hi-IN')||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('hi'))}
function speak(t){
 if(!ttsOn||!('speechSynthesis' in window))return;
 const clean=t.replace(/[*_#`]/g,'').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}]/gu,'').trim();
 if(!clean)return;
 speechSynthesis.cancel();
 const v=pickVoice();
 if(!v&&!warned){warned=true;add('⚠️ फ़ोन में हिंदी आवाज़ नहीं मिली। सेटिंग → Text-to-speech / भाषा → Google आवाज़ में हिंदी डाउनलोड करें।','ai')}
 const parts=clean.match(/[^।.!?\n]+[।.!?]?/g)||[clean];
 parts.forEach((p,i)=>{
  const u=new SpeechSynthesisUtterance(p.trim());u.lang='hi-IN';if(v)u.voice=v;u.pitch=S.pitch;u.rate=S.rate;
  if(i===0)u.onstart=()=>ch.classList.add('talk');
  if(i===parts.length-1)u.onend=u.onerror=()=>ch.classList.remove('talk');
  speechSynthesis.speak(u)});
}
// माइक (सुनना)
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec,listening=false;
function toggleMic(){
 if(!SR)return add('इस ब्राउज़र में वॉइस इनपुट नहीं है। Chrome इस्तेमाल करें।','ai');
 if(listening){rec.stop();return}
 unlockTTS();speechSynthesis.cancel();
 rec=new SR();rec.lang='hi-IN';rec.interimResults=true;rec.continuous=false;
